[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arnold-usd-gui"
version = "0.1.0"
description = "Minimal dark UI to kick Arnold renders from USD stages."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sébastien Durand"}]
keywords = ["usd", "openusd", "arnold", "kick", "render"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
dependencies = [
  "PySide6>=6.5",
]

[project.optional-dependencies]
pyside2 = ["PySide2>=5.15"]
dev = ["pytest>=7.0"]

[project.scripts]
arnold-usd-gui = "arnold_usd_gui:main"

[project.urls]
Homepage = "https://github.com/"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arnold_usd_gui = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
